name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # npm >= 11.5 needed for trusted publishing
          registry-url: "https://registry.npmjs.org"

      - name: Check tag matches package.json version
        id: get_version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          PKG="$(node -p "require('./package.json').version")"
          [ "$VERSION" = "$PKG" ] || { echo "::error::tag v$VERSION != package.json $PKG"; exit 1; }
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - run: npm ci

      # prepublishOnly runs build + verify
      - run: npm publish --provenance

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: |
            ## 📦 Install from npm

            ```bash
            npm install strapi-plugin-matomo@${{ steps.get_version.outputs.VERSION }}
            ```

            [View on npm](https://www.npmjs.com/package/strapi-plugin-matomo/v/${{ steps.get_version.outputs.VERSION }})
