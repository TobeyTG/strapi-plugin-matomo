name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -p admin/tsconfig.json --noEmit
      - run: npx tsc -p server/tsconfig.json --noEmit
      - run: npm run build
      - run: npm run verify
